# Project-scoped Codex config — committed so teammates get Playwright MCP too.
#
# Codex loads project-local config ONLY for TRUSTED projects. If Playwright's
# tools don't show up in `codex`, trust this folder once:
#   - run `codex` here and accept the trust prompt, or
#   - add  [projects.'<abs path to this repo>']  trust_level = "trusted"
#     to ~/.codex/config.toml
#
# (This machine's ~/.codex/config.toml already defines a global `playwright`
# server, so Codex works here regardless; this file is for fresh clones.)

# Headed browser + 800ms slow-mo so you can watch it drive (see
# playwright-mcp.config.json). Path is relative to the project root.
[mcp_servers.playwright]
command = "npx"
args = ["@playwright/mcp@latest", "--config", "playwright-mcp.config.json"]

[mcp_servers.playwright.tools.browser_resize]
approval_mode = "approve"

[mcp_servers.playwright.tools.browser_navigate]
approval_mode = "approve"

[mcp_servers.playwright.tools.browser_click]
approval_mode = "approve"

[mcp_servers.playwright.tools.browser_file_upload]
approval_mode = "approve"

[mcp_servers.playwright.tools.browser_tabs]
approval_mode = "approve"

[mcp_servers.playwright.tools.browser_type]
approval_mode = "approve"

[mcp_servers.playwright.tools.browser_evaluate]
approval_mode = "approve"

[mcp_servers.playwright.tools.browser_close]
approval_mode = "approve"
